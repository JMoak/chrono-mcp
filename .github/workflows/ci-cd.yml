name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Run MCP protocol tests
        run: npm run test:mcp

      - name: Check package contents
        run: npm pack --dry-run

  publish:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: chrono-mcp-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release commit and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Let semantic-release manage npm auth; registry-url creates token auth.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # npm trusts JMoak/chrono-mcp's ci-cd.yml with direct publishing enabled.
      # semantic-release uses OIDC and considers every commit since the last tag.
      - name: Publish release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
